<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira Frangos — Challenge 10K</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151c2c;
            --primary-red: #dc2626;
            --gold: #f59e0b;
            --green: #10b981;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            margin: 0;
            padding-bottom: 95px;
        }

        .navbar {
            background: #090d16;
            padding: 15px 20px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-tabs { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

        .tab-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--primary-red);
            color: white;
            border-color: var(--primary-red);
        }

        .container { max-width: 1100px; margin: 20px auto; padding: 0 20px; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .match-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
            margin-bottom: 12px;
        }

        .markets-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 10px;
        }

        .market-item {
            background: #0d1321;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-odd {
            background: #1e293b;
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-odd.active { background: var(--gold); color: black; }

        .betslip-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #090d16;
            border-top: 2px solid var(--gold);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('prognosticos', this)">Todos os Jogos</button>
            <button class="tab-btn" onclick="switchTab('gerador-multi', this)">Gerador Múltiplas</button>
        </div>
    </div>

    <div class="container">
        <div id="prognosticos" class="tab-content active">
            <h2 style="color: var(--gold);">Jogos Disponíveis</h2>
            <div id="listaJogosContainer"></div>
        </div>

        <div id="gerador-multi" class="tab-content">
            <h2 style="color: var(--gold);">Gerador</h2>
            <button onclick="gerarMultiplaIA()" style="background: var(--primary-red); color: white; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer;">Gerar</button>
            <div id="genResult" style="margin-top: 15px;"></div>
        </div>
    </div>

    <div class="betslip-bar">
        <div>Seleções: <span id="slipCount">0</span></div>
        <div>Odd Total: <span id="slipOdd">1.00</span></div>
    </div>

    <script>
        const jogosDatabase = [
            { id: 1, liga: "Premier League", equipas: "Arsenal vs Chelsea", opcoes: [{ label: "Vitória Arsenal", odd: 1.75 }, { label: "Vitória Chelsea", odd: 4.50 }] },
            { id: 2, liga: "Premier League", equipas: "Man City vs Liverpool", opcoes: [{ label: "Vitória Man City", odd: 1.90 }, { label: "Vitória Liverpool", odd: 3.50 }] }
        ];

        let selectedTips = [];

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (element) element.classList.add('active');
        }

        function renderJogos() {
            const container = document.getElementById('listaJogosContainer');
            if (!container) return;
            container.innerHTML = '';

            jogosDatabase.forEach(j => {
                let html = `<div class="match-card"><div class="match-header"><span>${j.liga}</span><strong>${j.equipas}</strong></div><div class="markets-grid">`;
                j.opcoes.forEach(op => {
                    let idAposta = `${j.equipas} - ${op.label}`;
                    let isSelected = selectedTips.some(s => s.id === idAposta);
                    html += `<div class="market-item"><span>${op.label}</span><button class="btn-odd ${isSelected ? 'active' : ''}" onclick="toggleAposta('${idAposta}', ${op.odd})">${op.odd.toFixed(2)}</button></div>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function toggleAposta(id, odd) {
            const index = selectedTips.findIndex(item => item.id === id);
            if (index > -1) selectedTips.splice(index, 1);
            else selectedTips.push({ id, odd });
            renderJogos();
            updateSlip();
        }

        function updateSlip() {
            document.getElementById('slipCount').innerText = selectedTips.length;
            let totalOdd = selectedTips.reduce((acc, item) => acc * item.odd, 1);
            document.getElementById('slipOdd').innerText = totalOdd.toFixed(2);
        }

        function gerarMultiplaIA() {
            let r = jogosDatabase[Math.floor(Math.random() * jogosDatabase.length)];
            let o = r.opcoes[0];
            document.getElementById('genResult').innerHTML = `<b>Sugestão:</b> ${r.equipas} (${o.label}) - Odd: ${o.odd}`;
        }

        window.onload = renderJogos;
    </script>
</body>
</html>
