<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira Frangos — Prognósticos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0b0f19;
            --bg-card: #111827;
            --accent: #ef4444;
            --accent-glow: rgba(239, 68, 68, 0.4);
            --gold: #fbbf24;
            --green: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border: #1f2937;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text-main); padding-bottom: 120px; }
        
        .navbar { display: flex; justify-content: center; gap: 10px; padding: 15px; background: var(--bg-card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .tab-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .tab-btn.active { background: var(--accent); color: white; border-color: var(--accent); box-shadow: 0 0 15px var(--accent-glow); }

        .container { max-width: 900px; margin: 20px auto; padding: 0 15px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .header-logo { text-align: center; margin: 20px 0; }
        .header-logo img { max-height: 150px; border-radius: 12px; }

        .match-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 15px; margin-bottom: 15px; }
        .match-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        .odds-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .btn-odd { background: #1f2937; border: 1px solid var(--border); color: var(--text-main); padding: 10px; border-radius: 8px; cursor: pointer; font-weight: 700; text-align: center; transition: 0.2s; }
        .btn-odd:hover, .btn-odd.active { background: var(--gold); color: #000; border-color: var(--gold); }

        .betslip { position: fixed; bottom: 0; left: 0; right: 0; background: var(--bg-card); border-top: 2px solid var(--gold); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .stake-input { width: 90px; background: var(--base); border: 1px solid var(--border); color: white; padding: 8px; border-radius: 6px; font-weight: bold; }
    </style>
</head>
<body>

    <nav class="navbar">
        <button class="tab-btn active" onclick="switchTab('prognosticos', this)"><i class="fa-solid fa-futbol"></i> Jogos de Hoje</button>
        <button class="tab-btn" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Challenge 10K</button>
    </nav>

    <div class="container">
        <div class="header-logo">
            <img src="https://raw.githubusercontent.com/Kazper90/apostas/main/ViraFrangosLogo.jpg" alt="Vira Frangos" onerror="this.src='ViraFrangosLogo.jpg'">
        </div>

        <section id="prognosticos" class="tab-content active">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem; color: var(--gold);">Partidas em Destaque</h2>
            <div id="listaJogos"></div>
        </section>

        <section id="dashboard" class="tab-content">
            <h2 style="margin-bottom: 15px; font-size: 1.2rem; color: var(--gold);">Evolução do Challenge</h2>
            <div class="match-card" style="height: 250px;">
                <canvas id="chartEvolucao"></canvas>
            </div>
        </section>
    </div>

    <div class="betslip">
        <div>
            <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">SELEÇÕES: <strong id="slipCount" style="color:white;">0</strong></span>
            <span style="font-size: 0.8rem; color: var(--text-muted);">ODD TOTAL: <strong id="slipOdd" style="color:var(--gold);">1.00</strong></span>
        </div>
        <div>
            <span style="font-size: 0.8rem; color: var(--text-muted);">STAKE (NOK):</span>
            <input type="number" id="slipStake" value="50" class="stake-input" oninput="updateSlip()">
        </div>
        <div>
            <span style="font-size: 0.8rem; color: var(--text-muted); display: block;">RETORNO:</span>
            <strong id="slipReturn" style="color: var(--green); font-size: 1.1rem;">0.00 NOK</strong>
        </div>
        <button onclick="clearSlip()" style="background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 6px; cursor: pointer;"><i class="fa-solid fa-trash"></i></button>
    </div>

    <script>
        const jogosHoje = [
            { id: 1, equipas: "Arsenal vs Chelsea", odds: [{ label: "1", odd: 1.75 }, { label: "X", odd: 3.60 }, { label: "2", odd: 4.50 }] },
            { id: 2, equipas: "Sporting CP vs Vitória SC", odds: [{ label: "1", odd: 1.45 }, { label: "X", odd: 4.20 }, { label: "2", odd: 6.50 }] },
            { id: 3, equipas: "CA Rosario Central vs SC Corinthians", odds: [{ label: "1", odd: 1.90 }, { label: "X", odd: 3.40 }, { label: "2", odd: 3.10 }] }
        ];

        let selectedTips = [];

        function switchTab(tabId, el) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            el.classList.add('active');
        }

        function renderJogos() {
            const container = document.getElementById('listaJogos');
            container.innerHTML = '';
            jogosHoje.forEach(j => {
                let html = `<div class="match-card"><div class="match-title">${j.equipas}</div><div class="odds-grid">`;
                j.odds.forEach(o => {
                    let uniqueId = `${j.id}-${o.label}`;
                    let isSelected = selectedTips.some(s => s.id === uniqueId);
                    html += `<button class="btn-odd ${isSelected ? 'active' : ''}" onclick="toggleOdd('${uniqueId}', '${j.equipas} (${o.label})', ${o.odd})">${o.label}: ${o.odd.toFixed(2)}</button>`;
                });
                html += `</div></div>`;
                container.innerHTML += html;
            });
        }

        function toggleOdd(id, selecao, odd) {
            const idx = selectedTips.findIndex(s => s.id === id);
            if (idx > -1) {
                selectedTips.splice(idx, 1);
            } else {
                selectedTips.push({ id, selecao, odd });
            }
            renderJogos();
            updateSlip();
        }

        function updateSlip() {
            const stake = parseFloat(document.getElementById('slipStake').value) || 0;
            document.getElementById('slipCount').innerText = selectedTips.length;
            if (selectedTips.length === 0) {
                document.getElementById('slipOdd').innerText = '1.00';
                document.getElementById('slipReturn').innerText = '0.00 NOK';
                return;
            }
            let totalOdd = selectedTips.reduce((acc, item) => acc * item.odd, 1);
            document.getElementById('slipOdd').innerText = totalOdd.toFixed(2);
            document.getElementById('slipReturn').innerText = (totalOdd * stake).toFixed(2) + ' NOK';
        }

        function clearSlip() {
            selectedTips = [];
            renderJogos();
            updateSlip();
        }

        window.onload = function() {
            renderJogos();
            const ctx = document.getElementById('chartEvolucao').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Início', 'Ronda 1'],
                    datasets: [{ data: [50, 50], borderColor: '#fbbf24', borderWidth: 2, tension: 0.3 }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        };
    </script>
</body>
</html>
