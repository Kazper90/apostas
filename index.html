     <!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira Frangos — Central de Dados e Prognósticos</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060913; --bg-card: #0f172a; --gold: #fbbf24; --green: #10b981; 
            --red: #ef4444; --text-main: #f8fafc; --text-muted: #94a3b8;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding-bottom: 150px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        /* Badges de Estado */
        .badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 4px; font-weight: 800; text-transform: uppercase; }
        .bg-finalizado { background: #334155; color: #cbd5e1; }
        .bg-vivo { background: var(--red); color: white; animation: pulse 2s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }

        /* Tabela de Jogos Estilo Profissional */
        .match-row {
            display: grid; grid-template-columns: 100px 1fr 150px 120px;
            align-items: center; background: var(--bg-card); padding: 15px 20px;
            border-radius: 12px; margin-bottom: 10px; border: 1px solid #1e293b;
        }
        .header-row { font-weight: 800; color: var(--text-muted); font-size: 0.8rem; background: transparent; border: none; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color: var(--gold); display: flex; align-items: center; gap: 10px;">
        <i class="fa-solid fa-database"></i> Base de Dados Centralizada
    </h2>

    <!-- Filtros Avançados -->
    <div style="margin: 20px 0;">
        <select id="filterStatus" onchange="renderLista()" style="background: var(--bg-card); color: white; padding: 10px; border-radius: 8px;">
            <option value="todos">Todos os Jogos</option>
            <option value="hoje">Apenas Hoje</option>
            <option value="finalizado">Histórico (Finalizados)</option>
        </select>
    </div>

    <!-- Cabeçalho da Lista -->
    <div class="match-row header-row">
        <div>DATA</div><div>PARTIDA</div><div>COMPETIÇÃO</div><div>ESTADO</div>
    </div>

    <div id="listaCompleta"></div>
</div>

<script>
    const baseDadosHistorica = [
        { data: "14/08", equipas: "Arsenal vs Chelsea", liga: "Premier League", estado: "vivo" },
        { data: "13/08", equipas: "Porto vs Benfica", liga: "Liga Portugal", estado: "finalizado" },
        { data: "12/08", equipas: "Real Madrid vs Barça", liga: "La Liga", estado: "finalizado" }
    ];

    function renderLista() {
        const filtro = document.getElementById('filterStatus').value;
        const container = document.getElementById('listaCompleta');
        container.innerHTML = '';

        baseDadosHistorica.filter(j => filtro === 'todos' || j.estado === filtro).forEach(j => {
            container.innerHTML += `
                <div class="match-row">
                    <div style="font-weight: 600;">${j.data}</div>
                    <div style="font-weight: 700;">${j.equipas}</div>
                    <div style="font-size: 0.85rem; color: var(--text-muted);">${j.liga}</div>
                    <div><span class="badge ${j.estado === 'vivo' ? 'bg-vivo' : 'bg-finalizado'}">${j.estado}</span></div>
                </div>
            `;
        });
    }

    renderLista();
</script>

</body>
</html>
