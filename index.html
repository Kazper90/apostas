<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vira Frangos — Betting Tips & Prognósticos de Especialistas</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #060913;
            --bg-surface: #0f172a;
            --bg-card: rgba(17, 24, 39, 0.85);
            --primary-red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.35);
            --gold: #fbbf24;
            --gold-light: #fde047;
            --gold-glow: rgba(251, 191, 36, 0.2);
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.3);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 140px;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(251, 191, 36, 0.03) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(239, 68, 68, 0.03) 0%, transparent 40%);
            background-attachment: fixed;
        }

        .navbar {
            background: rgba(6, 9, 19, 0.9);
            backdrop-filter: blur(16px);
            padding: 16px 24px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-tabs { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

        .tab-btn {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 22px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: var(--transition);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tab-btn:hover { color: var(--text-main); border-color: rgba(255, 255, 255, 0.2); }
        .tab-btn.active { background: linear-gradient(135deg, var(--primary-red), #b91c1c); color: white; border-color: transparent; box-shadow: 0 8px 20px var(--red-glow); }

        .header-banner {
            text-align: center;
            padding: 40px 20px 30px 20px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.8) 0%, transparent 100%);
            border-bottom: 1px solid var(--border-color);
        }

        .header-logo-wrapper {
            display: inline-block;
            padding: 5px;
            border-radius: 20px;
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.2), transparent);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            margin-bottom: 15px;
        }

        .header-logo { max-height: 220px; width: auto; object-fit: contain; display: block; border-radius: 16px; }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--gold);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .container { max-width: 1200px; margin: 35px auto; padding: 0 24px; }
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease forwards; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .section-title {
            color: var(--text-main);
            margin-bottom: 20px;
            font-size: 1.35rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .section-title i { color: var(--gold); }

        .controls-panel {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            backdrop-filter: blur(12px);
        }

        .filter-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 5px; }

        .filter-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            white-space: nowrap;
            transition: var(--transition);
        }

        .filter-btn:hover { border-color: var(--gold); color: white; }
        .filter-btn.active { background: linear-gradient(135deg, var(--gold), #d97706); color: #060913; font-weight: 800; border-color: transparent; }

        /* TIP CARD (OLBG STYLE) */
        .tip-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            transition: var(--transition);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: center;
        }

        @media(max-width: 768px) {
            .tip-card { grid-template-columns: 1fr; }
        }

        .tip-card:hover { border-color: rgba(251, 191, 36, 0.3); transform: translateY(-2px); }

        .tip-meta { display: flex; gap: 15px; align-items: center; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
        .tip-meta span { display: flex; align-items: center; gap: 5px; }
        .tip-teams { font-size: 1.15rem; font-weight: 800; color: white; margin-bottom: 10px; }
        
        .tipster-info {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(6, 9, 19, 0.5);
            padding: 8px 12px;
            border-radius: 10px;
            width: fit-content;
            font-size: 0.8rem;
            border: 1px solid var(--border-color);
        }

        .tipster-avatar { width: 28px; height: 28px; background: var(--gold); color: #060913; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 0.8rem; }

        .tip-action-box {
            background: rgba(6, 9, 19, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            min-width: 180px;
        }

        .tip-market { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
        .tip-prediction { font-size: 0.95rem; font-weight: 800; color: white; margin-bottom: 10px; }

        .btn-odd {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid var(--gold);
            color: var(--gold);
            font-weight: 800;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            text-align: center;
            transition: var(--transition);
        }

        .btn-odd:hover, .btn-odd.active { background: var(--gold); color: #060913; box-shadow: 0 0 15px var(--gold-glow); }

        .betslip-bar {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(6, 9, 19, 0.95);
            backdrop-filter: blur(20px);
            border-top: 2px solid var(--gold);
            padding: 16px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.8);
        }

        .betslip-info { display: flex; gap: 25px; align-items: center; flex-wrap: wrap; }
        .betslip-field-label { color: var(--text-muted); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; display: block; margin-bottom: 2px; }
        .stake-input { width: 80px; background: var(--bg-surface); border: 1px solid var(--border-color); color: white; padding: 6px 10px; border-radius: 6px; font-weight: 700; }
        .stake-input:focus { outline: none; border-color: var(--gold); }
        .btn-clear { background: transparent; border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 16px; cursor: pointer; border-radius: 8px; font-weight: 600; transition: var(--transition); }
        .btn-clear:hover { border-color: var(--primary-red); color: var(--primary-red); }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('dicas', this)"><i class="fa-solid fa-fire"></i> Betting Tips & Prognósticos</button>
            <button class="tab-btn" onclick="switchTab('dashboard', this)"><i class="fa-solid fa-chart-line"></i> Challenge 10K</button>
        </div>
    </nav>

    <header class="header-banner">
        <div class="header-logo-wrapper">
            <img src="https://raw.githubusercontent.com/Kazper90/apostas/main/ViraFrangosLogo.jpg" alt="Vira Frangos Logo" class="header-logo" onerror="this.onerror=null; this.src='ViraFrangosLogo.jpg';">
        </div>
        <div class="header-subtitle"><i class="fa-solid fa-ranking-star"></i> Comunidade de Tipsters & Análises de Especialistas</div>
    </header>

    <main class="container">
        <section id="dicas" class="tab-content active">
            <h2 class="section-title"><i class="fa-solid fa-list-check"></i> Melhores Dicas de Apostas da Época</h2>
            
            <div class="controls-panel">
                <div class="filter-bar" id="ligaFilterBar">
                    <button class="filter-btn active" onclick="setLiga('todas', this)">Todas as Ligas</button>
                    <button class="filter-btn" onclick="setLiga('PT Liga Portugal', this)">PT Liga Portugal</button>
                    <button class="filter-btn" onclick="setLiga('Premier League', this)">Premier League</button>
                    <button class="filter-btn" onclick="setLiga('La Liga', this)">La Liga</button>
                    <button class="filter-btn" onclick="setLiga('Serie A', this)">Serie A</button>
                    <button class="filter-btn" onclick="setLiga('Champions League', this)">Champions League</button>
                    <button class="filter-btn" onclick="setLiga('Copa Libertadores', this)">Copa Libertadores</button>
                </div>
            </div>

            <div id="listaTipsContainer"></div>
        </section>

        <section id="dashboard" class="tab-content">
            <div class="tip-card">
                <div>
                    <div class="tip-teams">Evolução do Challenge 10K</div>
                    <div style="height: 250px; width: 100%; margin-top: 15px;"><canvas id="chartEvolucao"></canvas></div>
                </div>
            </div>
        </section>
    </main>

    <div class="betslip-bar">
        <div class="betslip-info">
            <div><span class="betslip-field-label">Seleções</span><span id="slipCount" style="font-weight: 800; color: white;">0 Dica(s)</span></div>
            <div><span class="betslip-field-label">Odd Total</span><span id="slipOdd" style="font-weight: 800; color: var(--gold);">1.00</span></div>
            <div><span class="betslip-field-label">Stake (NOK)</span><input type="number" id="slipStake" value="50" class="stake-input" oninput="updateSlip()"></div>
            <div><span class="betslip-field-label">Retorno Possível</span><span id="slipReturn" style="font-weight: 800; color: var(--green);">0.00 NOK</span></div>
        </div>
        <button class="btn-clear" onclick="clearSlip()"><i class="fa-solid fa-trash-can"></i> Limpar</button>
    </div>

    <script>
        // BASE DE DADOS ESTILO OLBG (COM TIPSTERS E MERCADOS ESPECÍFICOS)
        const dbTips = [
            { id: 1, liga: "Premier League", data: "18/08/2026", equipas: "Manchester City vs Newcastle United", tipster: "MasterOdds", yield: "+14.2%", mercado: "Resultado Final", selecao: "Manchester City (1)", odd: 1.50 },
            { id: 2, liga: "PT Liga Portugal", data: "17/08/2026", equipas: "Sporting CP vs FC Porto", tipster: "FrangoKing", yield: "+22.5%", mercado: "Ambas as Equipas Marcam", selecao: "Sim", odd: 1.85 },
            { id: 3, liga: "La Liga", data: "16/08/2026", equipas: "FC Barcelona vs Valencia CF", tipster: "GolDePlaca", yield: "+9.8%", mercado: "Total de Golos", selecao: "Mais de 2.5", odd: 1.70 },
            { id: 4, liga: "Serie A", data: "15/08/2026", equipas: "AS Roma vs Lazio", tipster: "CalcioExpert", yield: "+18.1%", mercado: "Dupla Hipótese", selecao: "AS Roma ou Empate", odd: 1.38 },
            { id: 5, liga: "Copa Libertadores", data: "14/08/2026", equipas: "CA Rosario Central vs SC Corinthians Paulista", tipster: "SouthAmericaTips", yield: "+11.4%", mercado: "Resultado Final", selecao: "CA Rosario Central (1)", odd: 1.90 },
            { id: 6, liga: "Premier League", data: "14/08/2026", equipas: "Arsenal vs Chelsea", tipster: "LondonCalling", yield: "+25.0%", mercado: "Resultado Final", selecao: "Arsenal (1)", odd: 1.75 },
            { id: 7, liga: "PT Liga Portugal", data: "14/08/2026", equipas: "Sporting CP vs Vitória SC", tipster: "LeoPrognosticos", yield: "+12.0%", mercado: "Handicap Asiático", selecao: "Sporting CP -1.5", odd: 2.20 }
        ];

        let selectedTips = [];
        let ligaAtual = 'todas';

        function switchTab(tabId, element) {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (element) element.classList.add('active');
        }

        function setLiga(liga, element) {
            ligaAtual = liga;
            document.querySelectorAll('#ligaFilterBar .filter-btn').forEach(b => b.classList.remove('active'));
            if (element) element.classList.add('active');
            renderTips();
        }

        function renderTips() {
            const container = document.getElementById('listaTipsContainer');
            container.innerHTML = '';

            const filtrados = dbTips.filter(t => ligaAtual === 'todas' || t.liga === ligaAtual);

            if (filtrados.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px; font-weight: 600;">Sem dicas disponíveis para esta liga.</div>`;
                return;
            }

            filtrados.forEach(t => {
                let uniqueId = `${t.id}-${t.selecao}`;
                let isSelected = selectedTips.some(s => s.id === uniqueId);

                container.innerHTML += `
                    <div class="tip-card">
                        <div>
                            <div class="tip-meta">
                                <span><i class="fa-solid fa-trophy" style="color: var(--gold);"></i> ${t.liga}</span>
                                <span><i class="fa-solid fa-calendar"></i> ${t.data}</span>
                            </div>
                            <div class="tip-teams">${t.equipas}</div>
                            <div class="tipster-info">
                                <div class="tipster-avatar">${t.tipster.charAt(0)}</div>
                                <div>
                                    <strong style="color: white; display: block;">${t.tipster}</strong>
                                    <span style="color: var(--green);">Yield: ${t.yield}</span>
                                </div>
                            </div>
                        </div>
                        <div class="tip-action-box">
                            <div class="tip-market">${t.mercado}</div>
                            <div class="tip-prediction">${t.selecao}</div>
                            <button class="btn-odd ${isSelected ? 'active' : ''}" onclick="toggleTip('${uniqueId}', '${t.equipas}', '${t.selecao}', ${t.odd})">${t.odd.toFixed(2)}</button>
                        </div>
                    </div>
                `;
            });
        }

        function toggleTip(id, jogo, selecao, odd) {
            const index = selectedTips.findIndex(item => item.id === id);
            if (index > -1) {
                selectedTips.splice(index, 1);
            } else {
                selectedTips.push({ id, jogo, selecao, odd });
            }
            renderTips();
            updateSlip();
        }

        function updateSlip() {
            const stake = parseFloat(document.getElementById('slipStake').value) || 0;
            document.getElementById('slipCount').innerText = selectedTips.length + ' Dica(s)';
            if (selectedTips.length === 0) {
                document.getElementById('slipOdd').innerText = '1.00';
                document.getElementById('slipReturn').innerText = '0.00 NOK';
                return;
            }
            let totalOdd = selectedTips.reduce((acc, item) => acc * item.odd, 1);
            let totalReturn = totalOdd * stake;
            document.getElementById('slipOdd').innerText = totalOdd.toFixed(2);
            document.getElementById('slipReturn').innerText = totalReturn.toFixed(2) + ' NOK';
        }

        function clearSlip() {
            selectedTips = [];
            renderTips();
            updateSlip();
        }

        window.onload = function() {
            renderTips();
            const ctx = document.getElementById('chartEvolucao').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Início', 'Ronda 1'],
                    datasets: [{ data: [50, 50], borderColor: '#fbbf24', borderWidth: 3, tension: 0.4, fill: true, backgroundColor: 'rgba(251, 191, 36, 0.05)' }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        };
    </script>
</body>
</html>
